x-java-env: &java-env
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m"

services:
  ruoyi-mysql:
    restart: unless-stopped
    container_name: ruoyi-mysql
    image: mysql:5.7
    build:
      context: ./mysql
      dockerfile: dockerfile
    command:
      - mysqld
      - --innodb-buffer-pool-size=80M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
      - --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
      - ./mysql/db:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"
    networks:
      - career-internal

  ruoyi-redis:
    restart: unless-stopped
    container_name: ruoyi-redis
    image: redis:7
    build:
      context: ./redis
      dockerfile: dockerfile
    command: redis-server /home/ruoyi/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis/conf/redis.conf:/home/ruoyi/redis/redis.conf
      - ./redis/data:/data
    expose:
      - "6379"
    networks:
      - career-internal

  ruoyi-nacos:
    restart: unless-stopped
    container_name: ruoyi-nacos
    image: nacos/nacos-server:v3.0.2
    build:
      context: ./nacos
      dockerfile: dockerfile
    environment:
      MODE: cluster
      NACOS_SERVERS: ruoyi-nacos:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ruoyi-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: ry-config
      MYSQL_SERVICE_USER: ${MYSQL_USERNAME}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD}
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      NACOS_AUTH_CACHE_ENABLE: "true"
      JVM_XMS: 128m
      JVM_XMX: 512m
      JVM_XMN: 128m
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    expose:
      - "8848"
      - "9848"
      - "9849"
    depends_on:
      - ruoyi-mysql
    networks:
      - career-internal

  ruoyi-gateway:
    restart: unless-stopped
    container_name: ruoyi-gateway
    build:
      context: ./ruoyi/gateway
      dockerfile: dockerfile
    environment:
      <<: *java-env
      NACOS_SERVER_ADDR: ruoyi-nacos:8848
      SPRING_CLOUD_NACOS_SERVER_ADDR: ruoyi-nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: ruoyi-nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: ruoyi-nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD}
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD}
      REDIS_HOST: ruoyi-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "8080"
    depends_on:
      - ruoyi-nacos
      - ruoyi-redis
    networks:
      - career-internal

