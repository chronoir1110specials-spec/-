worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen       80;
        # 接受任意 Host（外层 HTTPS 终止后回源到本机 :18080，Host 为你的域名）
        server_name  _;

        # 基础安全响应头（设计 15.3）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        location / {
            root   /home/ruoyi/projects/career-web;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        location /api/ {
            set $gateway ruoyi-gateway:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 透传外层 HTTPS 协议（外层未传时默认 https，因公网入口为 HTTPS）
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$gateway;
        }

        # SSE 流式对话：关闭缓冲，保持长连接逐块下发
        location ~ ^/api/.*/messages/stream$ {
            set $gateway ruoyi-gateway:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 300s;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$gateway;
        }

        location /prod-api/ {
            set $gateway ruoyi-gateway:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            rewrite ^/prod-api/(.*)$ /$1 break;
            proxy_pass http://$gateway;
        }

        if ($uri ~ "/actuator") {
            return 403;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
